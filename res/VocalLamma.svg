<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="270" height="380" viewBox="0 0 270 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b34"/>
      <stop offset="1" stop-color="#15151a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6d2f"/>
      <stop offset="0.5" stop-color="#e8b34a"/>
      <stop offset="1" stop-color="#8a6d2f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="270" height="380" fill="url(#bg)"/>

  <!-- Inner frame -->
  <rect x="5" y="5" width="260" height="370" rx="3" fill="none" stroke="#3a3a46" stroke-width="1.5"/>

  <!-- Title underline -->
  <rect x="70" y="33" width="130" height="2" rx="1" fill="url(#gold)"/>


  <!-- Flanking diamonds for the DELAY header -->
  <polygon points="98,222 102,226 98,230 94,226" fill="#e8b34a" opacity="0.55"/>
  <polygon points="172,222 176,226 172,230 168,226" fill="#e8b34a" opacity="0.55"/>

  <!-- Delay section divider -->
  <rect x="16" y="242" width="238" height="1.5" rx="0.75" fill="url(#gold)" opacity="0.8"/>

  <!-- Bottom rule -->
  <rect x="70" y="370" width="130" height="2" rx="1" fill="url(#gold)" opacity="0.6"/>
</svg>
